# Site
locale         : "en-US"
lang           : "en"
title          : "Hoondy.com"
tagline        : "Notes, games & experiments from NYC"
description    : "Donghoon Lee's corner of the internet: a leadership test, a subway typing game, an artillery duel, and a blog going back to 2010."
url            : "https://hoondy.com"
baseurl        : ""
# Post permalinks are built from dates in UTC; changing this would move old post URLs.
timezone       : UTC
logo           : /assets/img/icon-512.png

author:
  name         : "Donghoon Lee"
  handle       : "hoondy"
  location     : "New York, NY"
  email        : "admin@hoondy.com"
  github       : "hoondy"
  twitter      : "hoondy"
  linkedin     : "hoondy"
  scholar      : "https://scholar.google.com/citations?user=_a8xSwwAAAAJ"
  orcid        : "0000-0003-0453-6059"
  lab          : "https://leelab.us"
  # avatar     : /assets/img/avatar.jpg   # optional square photo for /about/; the monogram bullet is used without it

twitter:
  username     : hoondy
social:
  name         : "Donghoon Lee"
  links:
    - "https://twitter.com/hoondy"
    - "https://www.linkedin.com/in/hoondy"
    - "https://github.com/hoondy"
    - "https://leelab.us"

# Google AdSense. Every billboard falls back to `default` when its own slot is empty.
# Create extra display units in AdSense and paste their slot ids to tune each size.
adsense:
  client       : "ca-pub-2034343186994327"
  slots:
    default    : "7644190892"
    horizontal : ""
    rectangle  : ""
    vertical   : ""

# Google Analytics 4 measurement id (loaded only in production builds).
ga4_id         : "G-BPDW4JEWCM"

# Weekly leaderboards. Leave empty to keep boards on each visitor's device;
# set to the deployed worker URL (see server/leaderboard) to make them global.
leaderboard_api: ""

comments:
  provider     : "disqus"
  disqus:
    shortname  : "hoondy"

# Content
permalink      : /:year/:month/:day/:title/
markdown       : kramdown
highlighter    : rouge
excerpt_separator: "\n\n"
kramdown:
  input        : GFM
  hard_wrap    : false
  auto_ids     : true
  entity_output: as_char
  smart_quotes : lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jemoji

include:
  - _pages
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules
  - vendor
  - server
  - .github
  - .sass-cache
  - .jekyll-cache

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-default.png
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      comments: true
      share: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
