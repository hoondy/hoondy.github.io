# Site
locale         : "en-US"
lang           : "en"
title          : "Hoondy.com"
tagline        : "Side projects, games and odd ideas"
description    : "Hoondy Sq, a small station for side projects, games and odd ideas: a leadership test, a subway typing game, an artillery duel, and a blog going back to 2010."
url            : "https://hoondy.com"
baseurl        : ""
# Post permalinks are built from dates in UTC; changing this would move old post URLs.
timezone       : UTC
logo           : /assets/img/icon-512.png

author:
  name         : "Hoondy"
  handle       : "hoondy"
  location     : "New York, NY"
  email        : "admin@hoondy.com"
  github       : "hoondy"
  twitter      : "hoondy"

twitter:
  username     : hoondy
social:
  name         : "Hoondy"
  links:
    - "https://x.com/hoondy"
    - "https://github.com/hoondy"

# Google AdSense. Each billboard format has its own display unit and falls back to
# `default` when its slot is empty. Vertical and rectangle are fixed-size units, so
# those panels are always exactly 300x600 and 300x250 (or not shown at all).
adsense:
  client       : "ca-pub-2034343186994327"
  slots:
    default    : "7644190892"   # hoondy_square (responsive)
    horizontal : "9689722480"   # hoondy_horizontal (responsive)
    rectangle  : "4317976303"   # hoondy_300_250 (fixed 300x250)
    vertical   : "7929918250"   # hoondy_300_600 (fixed 300x600)
  # Posts with fewer words than this are mostly a video or a few photos, which AdSense
  # counts as low-value content. Their billboards show only the site's own promos.
  min_words    : 100

# Google Analytics 4 measurement id (loaded only in production builds).
ga4_id         : "G-BPDW4JEWCM"

# Monthly game boards and the LQ score distribution. Leave empty to keep boards on each
# visitor's device; set to the deployed worker URL (see server/leaderboard) to share them.
leaderboard_api: "https://hoondy-leaderboard.hoondy-leaderboard.workers.dev"

comments:
  provider     : "disqus"
  disqus:
    shortname  : "hoondy"

# Content
permalink      : /:year/:month/:day/:title/
markdown       : kramdown
highlighter    : rouge
excerpt_separator: "\n\n"
kramdown:
  input        : GFM
  hard_wrap    : false
  auto_ids     : true
  entity_output: as_char
  smart_quotes : lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jemoji

include:
  - _pages
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules
  - vendor
  - server
  - .github
  - .sass-cache
  - .jekyll-cache

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-default.png
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      comments: true
      share: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
