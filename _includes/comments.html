{%- if site.comments.disqus.shortname -%}
<section class="comments" id="comments" aria-labelledby="comments-title" data-disqus="{{ site.comments.disqus.shortname }}" data-url="{{ page.url | absolute_url }}">
  <div class="comments__head">
    <div>
      <h2 id="comments-title">Comments</h2>
      <p class="comments__note">Comments are hosted by Disqus and load only when you ask for them.</p>
    </div>
    <button class="btn btn--ghost" type="button" data-disqus-load>{% include icon.html name="chat" %}Show comments</button>
  </div>
  <div id="disqus_thread"></div>
</section>
{%- endif -%}
