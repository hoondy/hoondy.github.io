{%- comment -%} Small scene for each app card. Decorative; the card text carries the meaning. {%- endcomment -%}
{%- case include.id -%}
{%- when "leadership" -%}
<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="lq-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#EE352E" stop-opacity=".38"/>
      <stop offset="1" stop-color="#EE352E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="180" fill="#101114"/>
  <circle cx="160" cy="90" r="96" fill="url(#lq-glow)"/>
  <g fill="#30323A">
    {%- for row in (0..4) %}{% for col in (0..10) %}
    <circle cx="{{ col | times: 26 | plus: 30 }}" cy="{{ row | times: 30 | plus: 30 }}" r="4.5"/>
    {%- endfor %}{% endfor %}
  </g>
  <g stroke="#EE352E" stroke-width="1.6" stroke-linecap="round" opacity=".7">
    <path d="M160 90 108 60M160 90 134 120M160 90 186 60M160 90 212 120M160 90 134 60M160 90 186 120M160 90 108 120M160 90 212 60M160 90 238 90M160 90 82 90"/>
  </g>
  <g fill="#9A9DA5">
    <circle cx="108" cy="60" r="5"/><circle cx="134" cy="120" r="5"/><circle cx="186" cy="60" r="5"/><circle cx="212" cy="120" r="5"/>
    <circle cx="134" cy="60" r="5"/><circle cx="186" cy="120" r="5"/><circle cx="108" cy="120" r="5"/><circle cx="212" cy="60" r="5"/>
    <circle cx="238" cy="90" r="5"/><circle cx="82" cy="90" r="5"/>
  </g>
  <circle class="art-pulse" cx="160" cy="90" r="16" fill="none" stroke="#EE352E" stroke-width="2"/>
  <circle cx="160" cy="90" r="17" fill="#EE352E"/>
  <text x="160" y="96.5" fill="#FFF" font-family="Inter Tight, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="19" text-anchor="middle">1</text>
  <g font-family="Doto, ui-monospace, monospace" font-weight="800" font-size="12" fill="#FFB000" letter-spacing="1">
    <text x="16" y="168">YOUR LQ ???</text>
    <text x="304" y="168" text-anchor="end">TOP ?%</text>
  </g>
</svg>
{%- when "rush-hour" -%}
<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="rh-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17121D"/>
      <stop offset="1" stop-color="#0E0E12"/>
    </linearGradient>
    <pattern id="rh-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#FCCC0A"/>
      <circle cx="3" cy="3" r="1.3" fill="#C9A107"/>
    </pattern>
    <clipPath id="rh-clip"><rect width="320" height="140"/></clipPath>
  </defs>
  <rect width="320" height="180" fill="url(#rh-sky)"/>
  <g stroke="#2A2433" stroke-width="1">
    <path d="M0 40h320M0 80h320M0 120h320"/>
  </g>
  <g clip-path="url(#rh-clip)" font-family="Inter Tight, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="14">
    <g class="art-fall">
      <rect x="28" y="10" width="92" height="28" rx="6" fill="#211C29" stroke="#B933AD" stroke-width="1.5"/>
      <text x="74" y="29" fill="#FFF" text-anchor="middle"><tspan fill="#FFB000">exp</tspan>ress</text>
    </g>
    <g class="art-fall art-fall--2">
      <rect x="140" y="10" width="76" height="28" rx="6" fill="#211C29" stroke="#4A3F57" stroke-width="1.5"/>
      <text x="178" y="29" fill="#E7E3EE" text-anchor="middle">uptown</text>
    </g>
    <g class="art-fall art-fall--3">
      <rect x="226" y="10" width="78" height="28" rx="6" fill="#211C29" stroke="#4A3F57" stroke-width="1.5"/>
      <text x="265" y="29" fill="#E7E3EE" text-anchor="middle">transfer</text>
    </g>
  </g>
  <rect y="140" width="320" height="40" fill="#2B2C31"/>
  <rect y="140" width="320" height="9" fill="url(#rh-dots)"/>
  <rect y="149" width="320" height="2" fill="#1A1B1F"/>
  <g transform="translate(22 164)">
    <path d="M0 -11 11 0 0 11 -11 0Z" fill="#B933AD"/>
    <text x="0" y="5" fill="#FFF" font-family="Inter Tight, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="13" text-anchor="middle">7</text>
  </g>
  <text x="42" y="169" fill="#C8C3CF" font-family="Doto, ui-monospace, monospace" font-weight="800" font-size="12" letter-spacing="1">STAGE 3 · EXPRESS</text>
  <text x="304" y="169" fill="#FFB000" font-family="Doto, ui-monospace, monospace" font-weight="800" font-size="12" text-anchor="end" letter-spacing="1">2,450</text>
</svg>

  <circle cx="262" cy="34" r="11" fill="#F4E9D3" opacity=".9"/>

    <circle cx="40" cy="22" r="1"/><circle cx="92" cy="40" r=".8"/><circle cx="150" cy="18" r="1"/><circle cx="210" cy="30" r=".8"/><circle cx="300" cy="64" r=".8"/>

  <g transform="translate(58 80)">

    <rect x="-7" y="-6" width="14" height="7" rx="3" fill="#6CBE45"/>

  <g transform="translate(255 92)">

    <rect x="-7" y="-6" width="14" height="7" rx="3" fill="#A7A9AC"/>
    <rect x="-18" y="-6" width="16" height="3" rx="1.5" fill="#A7A9AC" transform="rotate(32 -2 -4.5)"/>
  </g>
  <g font-family="Doto, ui-monospace, monospace" font-weight="800" font-size="12" fill="#FFB000" letter-spacing="1">
    <text x="16" y="24">WIND ◀ 12</text>
    <text x="16" y="40" fill="#FFD27A" opacity=".85">ANGLE 52°</text>
  </g>
</svg>
{%- endcase -%}
